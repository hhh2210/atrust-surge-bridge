# [Proxy] in Ash_origin.conf already uses #!include — do NOT put a local
# proxy line in that section. Put the proxy in a detached profile and append
# it to the include list (same pattern as AppleRelay.dconf).
#
# File: HITSZ-aTrust.dconf (next to Ash_origin.conf)
[Proxy]
HITSZ-aTrust = socks5, 127.0.0.1, 1080
#
# In Ash_origin.conf [Proxy] #!include ..., append: HITSZ-aTrust.dconf
#
# Add inside [Proxy Group]
HITSZ = fallback, DIRECT, HITSZ-aTrust, url=https://jw.hitsz.edu.cn/, interval=60, timeout=3, evaluate-before-use=true
#
# Add inside [Rule], before DOMAIN-SUFFIX,hitsz.edu.cn,DIRECT
DOMAIN,jw.hitsz.edu.cn,HITSZ
IP-CIDR,10.248.16.0/20,HITSZ,no-resolve
